<!DOCTYPE html>
<html dir="ltr" lang="uk">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Стартовий шаблон із Tailwind CSS та Vite.">
    <title>Project</title>
    <script type="module" src="/src/js/app.js"></script>
  </head>
  <body>
    <header class="o-header js--header" lang="en">
      <div class="o-header__bar">
        <div class="container">
          <div class="o-header__inner">
            <a class="o-header__logo" href="#" aria-label="Positivus home">
              <img src="/src/images/positivus-logo.svg" alt="Positivus" width="219.537" height="36">
            </a>
            <button class="o-header__toggle js--header-toggle" type="button" aria-label="Open navigation" aria-expanded="false" aria-controls="header-navigation">
              <span class="o-header__toggle-line" aria-hidden="true"></span>
              <span class="o-header__toggle-line" aria-hidden="true"></span>
              <span class="o-header__toggle-line" aria-hidden="true"></span>
            </button>
            <nav class="o-header__navigation js--header-navigation" id="header-navigation" aria-label="Main navigation">
              <ul class="o-header__list">
                <li><a class="o-header__link" href="#">About us</a></li>
                <li><a class="o-header__link" href="#">Services</a></li>
                <li><a class="o-header__link" href="#">Use Cases</a></li>
                <li><a class="o-header__link" href="#">Pricing</a></li>
                <li><a class="o-header__link" href="#">Blog</a></li>
              </ul>
              <a class="c-button o-header__button" href="#">Request a quote</a>
            </nav>
          </div>
        </div>
      </div>
    </header>
    <main>
      <section class="s-cta" lang="en">
        <div class="container">
          <div class="s-cta__card">
            <div class="s-cta__content">
              <h2 class="s-cta__title">Let’s make things happen</h2>
              <p class="s-cta__description">Contact us today to learn more about how our digital marketing services can help your business grow and succeed online.</p>
              <a class="c-button s-cta__button" href="#">Get your free proposal</a>
            </div>
            <div class="s-cta__illustration">
              <img src="/src/images/cta-illustration.svg" alt="" width="359" height="394.269" aria-hidden="true">
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
